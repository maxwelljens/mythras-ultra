version: 2

builds:
  - binary: myul
    main: ./cmd/myul
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.buildDate={{.Date}} -X main.version={{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - arm64
      - amd64
      - "386"

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

upx:
  - enabled: true
    # Linux and Windows only: UPX-packed macOS binaries break Gatekeeper,
    # and LZMA/brute-force modes exhausted the build machine's resources.
    goos: [linux, windows]
    # NRV level 9 — fast and light on memory. Never --best (grinds for
    # minutes on large Go binaries), never LZMA, never brute.
    compress: "9"
    lzma: false
    brute: false
